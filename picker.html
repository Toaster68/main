<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Setup</title>
    <link rel="icon" href="cellsalive_files/favicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300&display=swap');

        :root {
            --bg: #0c0c0c;
            --textcolor: #fff;
            --uibg: #242424;
            --inputbg: #333333;
            --inputborder: #444444;
            --shadow: 2px 2px 5px rgba(255, 255, 255, 0.1);
        }

        * {
            transition-duration: 0.5s;
            outline: none;
            border: none;
            box-sizing: border-box;
            text-align: center;
            font-family: 'Prompt', sans-serif;
            color: var(--textcolor);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header, footer {
            background-color: var(--uibg);
            padding: 0.7rem;
            width: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        header {
            border-radius: 0 0 20px 20px;
            box-shadow: 0 5px 10px var(--uibg);
        }

        footer {
            margin-top: auto;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -5px 10px var(--uibg);
            font-size: 0.9rem;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            gap: 1.5rem;
        }

        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }

        button, .btn-like {
            cursor: pointer;
            background-color: var(--inputbg);
            border: 3px solid var(--inputborder);
            border-radius: 10px;
            padding: 0.8rem 1.8rem;
            margin: 0.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover, .btn-like:hover {
            filter: brightness(80%);
            transform: scale(1.07);
        }

        .school-choice {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .bookmarkletdiv {
            width: 320px;
            background-color: var(--uibg);
            box-shadow: 0px 0px 5px 5px var(--uibg);
            padding: 1.2rem;
            margin: 1rem;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        .bookmarkletdiv a {
            font-size: 2rem;
            font-weight: bold;
            text-decoration: none;
            background: var(--inputbg);
            border: 2px solid var(--inputborder);
            border-radius: 10px;
            padding: 0.5rem 2rem;
            cursor: grab;
            display: inline-block;
            color: var(--textcolor);
        }
        .bookmarkletdiv a:active { cursor: grabbing; }

        .note { font-size: 0.9rem; opacity: 0.8; line-height: 1.3; }
        .hidden { display: none !important; }

        pre {
            background: var(--uibg);
            border: 2px solid var(--inputborder);
            border-radius: 10px;
            padding: 0.8rem;
            width: 100%;
            max-width: 600px;
            text-align: left;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: var(--textcolor);
            user-select: all;
            margin: 0 auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <header>
        <h2 style="margin:0;">CELLS alive!</h2>
    </header>

    <main>
        <div id="schoolPhase">
            <h1>Welcome!</h1>
            <p>Select your school level:</p>
            <div class="school-choice">
                <button id="elementaryBtn">Elementary</button>
                <button id="middleBtn">Middle School</button>
                <button id="highBtn">High School</button>
            </div>
        </div>

        <div id="bookmarkPhase" class="hidden">
            <h2>Pick one bookmark and stick with it for the year</h2>
            <p>Drag a button to your bookmarks bar, then click Continue below it.</p>
            <div style="display:flex; flex-wrap:wrap; justify-content:center;">
                <div class="bookmarkletdiv" id="cellsaliveDiv">
                    <a id="cellsaliveLink" href="#" title="Drag to bookmarks bar">cellsalive</a>
                    <div class="note">Will require searching <strong>games</strong> to access</div>
                    <pre><code id="cellsaliveCode"></code></pre>
                    <button class="continueBtn" data-choice="cellsalive">Continue</button>
                </div>
                <div class="bookmarkletdiv" id="jscellsaliveDiv">
                    <a id="jscellsaliveLink" href="#" title="Drag to bookmarks bar">JScellsalive</a>
                    <div class="note">Direct access – no password</div>
                    <pre><code id="jscellsaliveCode"></code></pre>
                    <button class="continueBtn" data-choice="jscellsalive">Continue</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 Game Site – Setup Wizard</p>
    </footer>

    <script>
        function getSchoolLevelFromCookie() {
            var cookies = document.cookie.split('; ');
            var c = cookies.find(row => row.startsWith("schoolLevel="));
            return c ? c.split('=')[1] : null;
        }

        function buildCellsaliveLink(level) {
            return location.origin + "/?utm_school=" + level;
        }

        function buildJScellsaliveLink(level) {
            return "https://cdn.jsdelivr.net/gh/placeholder/repo@version/file.svg?utm_school=" + level;
        }

        function updateAllLinks() {
            var level = getSchoolLevelFromCookie();
            if (!level) return;
            var cellsAliveLink = document.getElementById("cellsaliveLink");
            var cellsAliveCode = document.getElementById("cellsaliveCode");
            if (cellsAliveLink && cellsAliveCode) {
                var url = buildCellsaliveLink(level);
                cellsAliveLink.href = url;
                cellsAliveCode.textContent = url;
            }
            var jsLink = document.getElementById("jscellsaliveLink");
            var jsCode = document.getElementById("jscellsaliveCode");
            if (jsLink && jsCode) {
                var url = buildJScellsaliveLink(level);
                jsLink.href = url;
                jsCode.textContent = url;
            }
        }

        (function() {
            var cookies = document.cookie.split('; ');
            var chosen = cookies.find(c => c.startsWith("chosenBookmark="));
            if (chosen) {
                var choice = chosen.split('=')[1];
                var level = getSchoolLevelFromCookie() || "unknown";
                if (choice === "cellsalive") {
                    window.top.location.href = buildCellsaliveLink(level);
                } else if (choice === "jscellsalive") {
                    window.top.location.href = buildJScellsaliveLink(level);
                }
                return;
            }
        })();

        function setSchoolLevel(level) {
            document.cookie = "schoolLevel=" + level + "; path=/; max-age=" + (60*60*24*365);
            updateAllLinks();
            document.getElementById("schoolPhase").classList.add("hidden");
            document.getElementById("bookmarkPhase").classList.remove("hidden");
        }

        document.getElementById("elementaryBtn").addEventListener("click", function(){ setSchoolLevel("elementary"); });
        document.getElementById("middleBtn").addEventListener("click", function(){ setSchoolLevel("middle"); });
        document.getElementById("highBtn").addEventListener("click", function(){ setSchoolLevel("high"); });

        window.addEventListener("DOMContentLoaded", function() {
            var level = getSchoolLevelFromCookie();
            if (level) {
                updateAllLinks();
                document.getElementById("schoolPhase").classList.add("hidden");
                document.getElementById("bookmarkPhase").classList.remove("hidden");
            }
        });

        document.querySelectorAll('.continueBtn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var choice = this.getAttribute('data-choice');
                document.cookie = "chosenBookmark=" + choice + "; path=/; max-age=" + (60*60*24*365);
                var level = getSchoolLevelFromCookie() || "unknown";
                if (choice === "cellsalive") {
                    window.top.location.href = buildCellsaliveLink(level);
                } else {
                    window.top.location.href = buildJScellsaliveLink(level);
                }
            });
        });
    </script>
</body>
</html>
