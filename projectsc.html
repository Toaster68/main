<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games Dashboard</title>

  <link rel="stylesheet" href="https://du11hjcvx0uqb.cloudfront.net/dist/brandable_css/no_variables/bundles/fonts-eb4a10fb18.css">
  <link rel="stylesheet" href="https://du11hjcvx0uqb.cloudfront.net/dist/brandable_css/default/variables-high_contrast-9dec371ad57e3dd0396f0b2eddb63479.css">
  <link rel="stylesheet" href="https://du11hjcvx0uqb.cloudfront.net/dist/brandable_css/new_styles_high_contrast/bundles/common-a6bc767612.css">
  <link rel="stylesheet" href="https://du11hjcvx0uqb.cloudfront.net/dist/brandable_css/new_styles_high_contrast/bundles/dashboard_card-d3730b1cde.css">
  <link rel="stylesheet" href="https://du11hjcvx0uqb.cloudfront.net/dist/brandable_css/new_styles_high_contrast/bundles/dashboard-caec3b50bb.css">
  <link rel="stylesheet" href="https://du11hjcvx0uqb.cloudfront.net/dist/brandable_css/new_styles_high_contrast/bundles/react_todo_sidebar-df089b77a5.css">

  <style>
    /* Ensure the body takes up the full screen height */
    body {
      margin: 0;
      background: #f5f5f5;
      font-family: "Lato", sans-serif;
    }

    /* Global Left Navigation */
    .ic-app-header {
      position: fixed;
      left: 0;
      top: 0;
      width: 84px;
      height: 100vh;
      background-color: #394B58;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }

    .ic-app-header__menu-list-item {
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
      color: white;
      cursor: pointer;
      text-decoration: none;
      font-size: 12px;
    }

    .ic-app-header__menu-list-item svg {
      fill: white;
      width: 30px;
      height: 30px;
      margin-bottom: 5px;
    }

    .ic-app-header__menu-list-item--active {
      background: #fff;
      color: #0A5A9E;
      border-left: 4px solid #0A5A9E;
      padding: 10px 0;
    }
    .ic-app-header__menu-list-item--active svg {
      fill: #0A5A9E;
    }

    /* Main Content Wrapper */
    .ic-Layout-wrapper {
      margin-left: 84px; /* Clears the fixed left sidebar */
      display: flex;
      min-height: 100vh;
    }

    .ic-Layout-columns {
      display: flex;
      flex: 1;
      padding: 24px 36px;
      gap: 36px;
    }

    .ic-Layout-contentMain {
      flex: 1;
    }

    /* Right Sidebar (To Do List) */
    .ic-app-main-content__secondary {
      width: 300px;
      flex-shrink: 0;
    }

    .todo-header {
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #c7cdd1;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .todo-item {
      display: flex;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .todo-item svg {
      fill: #0A5A9E;
      width: 20px;
      height: 20px;
      margin-right: 12px;
    }

    .todo-item-details {
      flex: 1;
    }

    .todo-item-title {
      color: #0A5A9E;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .todo-item-course, .todo-item-due {
      color: #556572;
      font-size: 12px;
    }

    /* Games Dashboard Grid */
    .ic-Dashboard-header__title {
      font-size: 24px;
      font-weight: normal;
      margin-bottom: 24px;
      color: #273540;
    }

    .ic-DashboardCard__box__container {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* Enforces the 3-card wide layout */
      gap: 30px;
    }

    /* Game Viewer (Hidden by default, overlays cards when active) */
    #gameViewerContainer {
      display: none;
      width: 100%;
      height: calc(100vh - 100px);
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      flex-direction: column;
    }

    .game-viewer-toolbar {
      background: #394B58;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      color: white;
      align-items: center;
    }

    .game-viewer-toolbar button {
      background: #fff;
      color: #394B58;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    #gameFrame {
      flex: 1;
      border: none;
      width: 100%;
      background: black;
    }
  </style>
</head>
<body>

  <nav class="ic-app-header">
    <a href="#" class="ic-app-header__menu-list-item">
      <div style="width:40px;height:40px;background:#fff;border-radius:50%;margin:0 auto 5px;"></div>
      Account
    </a>
    <a href="#" class="ic-app-header__menu-list-item ic-app-header__menu-list-item--active">
      <svg viewBox="0 0 280 200"><path d="M273 180H197V164h62A122 122 0 1 0 17 142a124 124 0 0 0 2 22H90v16H6l-1-6A138 138 0 0 1 1 142C1 65 63 3 140 3S278 65 278 142a137 137 0 0 1-3 32Z"/></svg>
      Dashboard
    </a>
    <a href="#" class="ic-app-header__menu-list-item">
      <svg viewBox="0 0 280 259"><path d="M73 198c-11 0-22 8-24 18a26 26 0 0 0 0 3v1a22 22 0 0 0 5 14 22 22 0 0 0 17 8H200V228H66V213H200V198ZM94 92h90V62H94ZM79 107V46H200v60ZM86 137V122H192v15ZM207 167v-15H86v15ZM86 167ZM65 152V46H64c0-7 6-14 14-14H214V212H73a38 38 0 0 0-8 0ZM36 31h0A14 14 0 0 0 22 45v167a22 22 0 0 1 14-5V31Z"/></svg>
      Courses
    </a>
  </nav>

  <div class="ic-Layout-wrapper">
    <div class="ic-Layout-columns">
      
      <main class="ic-Layout-contentMain">
        <h1 class="ic-Dashboard-header__title" id="dashboardTitle">Dashboard</h1>

        <div class="ic-DashboardCard__box__container" id="gamesContainer">
          </div>

        <div id="gameViewerContainer">
          <div class="game-viewer-toolbar">
            <span id="gameViewerTitle">Loading Game...</span>
            <div>
               <button onclick="document.getElementById('gameFrame').requestFullscreen()">Fullscreen</button>
               <button onclick="closeGameViewer()">Close Game</button>
            </div>
          </div>
          <iframe id="gameFrame" allowfullscreen></iframe>
        </div>
      </main>

      <aside class="ic-app-main-content__secondary">
        <div class="todo-header">To Do</div>
        
        <div class="todo-item">
          <svg viewBox="0 0 1920 1920"><path d="M1468 0v564h-112V112H112v1694h1242v-225h112v338H0V0h1468Zm129 581c22-22 57-22 79 0l225 225c22 22 22 57 0 79l-677 677c-10 10-24 16-39 16h-225c-31 0-56-25-56-56v-225c0-15 5-29 16-39Zm-155 314-425 425v146h146l425-425-146-146Zm-764 346v112H338v-112h338Zm225-225v112H338v-112h564Zm734-315-115 115 146 146 115-115-146-146ZM1129 338v451H338V338h790Zm-112 112H451v225h564V451Z"/></svg>
          <div class="todo-item-details">
            <div class="todo-item-title">Study for Test</div>
            <div class="todo-item-course">AP Gaming</div>
            <div class="todo-item-due">10 points • Due Tomorrow</div>
          </div>
        </div>

        <div class="todo-item">
          <svg viewBox="0 0 1920 1920"><path d="M1468 0v564h-112V112H112v1694h1242v-225h112v338H0V0h1468Zm129 581c22-22 57-22 79 0l225 225c22 22 22 57 0 79l-677 677c-10 10-24 16-39 16h-225c-31 0-56-25-56-56v-225c0-15 5-29 16-39Zm-155 314-425 425v146h146l425-425-146-146Zm-764 346v112H338v-112h338Zm225-225v112H338v-112h564Zm734-315-115 115 146 146 115-115-146-146ZM1129 338v451H338V338h790Zm-112 112H451v225h564V451Z"/></svg>
          <div class="todo-item-details">
            <div class="todo-item-title">Read the textbook</div>
            <div class="todo-item-course">English</div>
            <div class="todo-item-due">100 points • Due Next Week</div>
          </div>
        </div>
      </aside>

    </div>
  </div>

  <script src="games.js"></script>

  <script>
    // Overriding the display logic from your games.js to format as Canvas Cards
    function renderCanvasCards() {
      const container = document.getElementById('gamesContainer');
      container.innerHTML = ''; 

      // Fallback if gamelist isn't loaded yet from games.js
      if (!window.gamelist || window.gamelist.length === 0) {
        setTimeout(renderCanvasCards, 500);
        return;
      }

      window.gamelist.forEach(game => {
        // Build image URL using your provided CDN replacements
        const coverURL = "https://cdn.jsdelivr.net/gh/Toaster68/covers2@main";
        let imgSrc = game.cover ? game.cover.replace('{COVER_URL}', coverURL) : '';
        let gameAuthor = game.author || game.dev || 'Unknown Author';

        // Create the Canvas Card HTML
        const card = document.createElement('div');
        card.className = 'ic-DashboardCard';
        card.innerHTML = `
          <div class="ic-DashboardCard__header" style="height: 146px; background-image: url('${imgSrc}'); background-size: cover; background-position: center;">
          </div>
          <div style="padding: 15px;">
            <div style="font-weight: bold; font-size: 16px; color: #0A5A9E; margin-bottom: 5px;">${game.name}</div>
            <div style="font-size: 12px; color: #556572;">${gameAuthor}</div>
          </div>
        `;

        // Click event to hide cards and show the game viewer
        card.addEventListener('click', () => {
          document.getElementById('gamesContainer').style.display = 'none';
          document.getElementById('dashboardTitle').style.display = 'none';
          
          const viewer = document.getElementById('gameViewerContainer');
          viewer.style.display = 'flex';
          
          document.getElementById('gameViewerTitle').innerText = game.name;
          
          const htmlURL = "https://cdn.jsdelivr.net/gh/Toaster68/html2@main";
          document.getElementById('gameFrame').src = game.html.replace('{HTML_URL}', htmlURL);
        });

        container.appendChild(card);
      });
    }

    // Function to handle closing the game and returning to the dashboard grid
    function closeGameViewer() {
      document.getElementById('gameViewerContainer').style.display = 'none';
      document.getElementById('gameFrame').src = '';
      
      document.getElementById('gamesContainer').style.display = 'grid';
      document.getElementById('dashboardTitle').style.display = 'block';
    }

    // Run the rendering function once the DOM is loaded
    document.addEventListener('DOMContentLoaded', renderCanvasCards);
  </script>

</body>
</html>
