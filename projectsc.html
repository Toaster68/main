<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games Dashboard</title>

  <link rel="stylesheet" href="https://du11hjcvx0uqb.cloudfront.net/dist/brandable_css/no_variables/bundles/fonts-eb4a10fb18.css">
  <link rel="stylesheet" href="https://du11hjcvx0uqb.cloudfront.net/dist/brandable_css/default/variables-high_contrast-9dec371ad57e3dd0396f0b2eddb63479.css">
  <link rel="stylesheet" href="https://du11hjcvx0uqb.cloudfront.net/dist/brandable_css/new_styles_high_contrast/bundles/common-a6bc767612.css">
  <link rel="stylesheet" href="https://du11hjcvx0uqb.cloudfront.net/dist/brandable_css/new_styles_high_contrast/bundles/dashboard_card-d3730b1cde.css">
  <link rel="stylesheet" href="https://du11hjcvx0uqb.cloudfront.net/dist/brandable_css/new_styles_high_contrast/bundles/dashboard-caec3b50bb.css">
  <link rel="stylesheet" href="https://du11hjcvx0uqb.cloudfront.net/dist/brandable_css/new_styles_high_contrast/bundles/react_todo_sidebar-df089b77a5.css">

  <style>
    body {
      margin: 0;
      background: #f5f5f5;
      font-family: "Lato", sans-serif;
    }

    /* =========================================================
       GLOBAL NAV (Left Sidebar - Collapsed Icon Only View)
       ========================================================= */
    .ic-app-header {
      position: fixed;
      left: 0;
      top: 0;
      width: 54px; /* Canvas Collapsed Width */
      height: 100vh;
      background-color: #394B58;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 15px;
    }

    .ic-app-header__menu-list-item {
      width: 100%;
      height: 54px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
      border-left: 4px solid transparent;
    }

    .ic-app-header__menu-list-item svg {
      fill: white;
      width: 26px;
      height: 26px;
    }

    /* Active Dashboard Icon */
    .ic-app-header__menu-list-item--active {
      background: #fff;
      border-left: none;
      border-right: 4px solid #0A5A9E; /* Mirrored border logic */
    }
    .ic-app-header__menu-list-item--active svg {
      fill: #0A5A9E;
    }

    /* Square Avatar per your request */
    .ic-avatar-square {
      width: 32px;
      height: 32px;
      background: #fff;
      margin: 0 auto;
      border-radius: 0; /* No rounded corners */
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: #394B58;
    }

    /* =========================================================
       MAIN LAYOUT & 3-COLUMN GRID
       ========================================================= */
    .ic-Layout-wrapper {
      margin-left: 54px; /* Clears the collapsed left sidebar */
      display: flex;
      min-height: 100vh;
    }

    .ic-Layout-columns {
      display: flex;
      flex: 1;
      padding: 24px 36px;
      gap: 36px;
    }

    .ic-Layout-contentMain {
      flex: 1;
      min-width: 0;
    }

    .ic-Dashboard-header__title {
      font-size: 24px;
      font-weight: normal;
      margin-top: 0;
      margin-bottom: 24px;
      color: #273540;
    }

    /* Force games container into exactly 3 columns */
    #games {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 30px !important;
    }

    .ic-DashboardCard {
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s;
    }

    .ic-DashboardCard:hover {
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }

    /* =========================================================
       INLINE GAME VIEWER (Replaces cards, keeps sidebars)
       ========================================================= */
    #gameViewerContainer {
      display: none;
      width: 100%;
      height: calc(100vh - 80px);
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      flex-direction: column;
    }

    .game-viewer-toolbar {
      background: #fff;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      color: #273540;
      align-items: center;
      border-bottom: 1px solid #c7cdd1;
    }

    .game-viewer-toolbar button {
      background: #f5f5f5;
      color: #273540;
      border: 1px solid #c7cdd1;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .game-viewer-toolbar button:hover { background: #e8eaec; }

    /* The div that games.js injects the iframe into */
    #gameViewer {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    #gameViewer iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #000;
    }

    /* =========================================================
       RIGHT SIDEBAR (To Do List)
       ========================================================= */
    .ic-app-main-content__secondary {
      width: 280px;
      flex-shrink: 0;
    }

    .todo-header {
      font-size: 1.125rem;
      font-weight: 700;
      border-bottom: 1px solid #c7cdd1;
      padding-bottom: 8px;
      margin-bottom: 16px;
      color: #273540;
    }

    .todo-item {
      display: flex;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .todo-item svg {
      fill: #3e5466;
      width: 16px;
      height: 16px;
      margin-right: 12px;
      margin-top: 2px;
    }

    .todo-item-details {
      flex: 1;
    }

    .todo-item-title {
      color: #273540;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 0.875rem;
    }

    .todo-item-course, .todo-item-due {
      color: #4a5b68;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <nav class="ic-app-header">
    <a href="#" class="ic-app-header__menu-list-item" title="Account">
      <div class="ic-avatar-square">S</div>
    </a>
    <a href="#" class="ic-app-header__menu-list-item ic-app-header__menu-list-item--active" title="Dashboard">
      <svg viewBox="0 0 280 200"><path d="M273 180H197V164h62A122 122 0 1 0 17 142a124 124 0 0 0 2 22H90v16H6l-1-6A138 138 0 0 1 1 142C1 65 63 3 140 3S278 65 278 142a137 137 0 0 1-3 32Z"/></svg>
    </a>
    <a href="#" class="ic-app-header__menu-list-item" title="Courses">
      <svg viewBox="0 0 280 259"><path d="M73 198c-11 0-22 8-24 18a26 26 0 0 0 0 3v1a22 22 0 0 0 5 14 22 22 0 0 0 17 8H200V228H66V213H200V198ZM94 92h90V62H94ZM79 107V46H200v60ZM86 137V122H192v15ZM207 167v-15H86v15ZM86 167ZM65 152V46H64c0-7 6-14 14-14H214V212H73a38 38 0 0 0-8 0ZM36 31h0A14 14 0 0 0 22 45v167a22 22 0 0 1 14-5V31Z"/></svg>
    </a>
  </nav>

  <div class="ic-Layout-wrapper">
    <div class="ic-Layout-columns">
      
      <main class="ic-Layout-contentMain">
        <h1 class="ic-Dashboard-header__title" id="dashboardTitle">Dashboard</h1>

        <div id="games">
          </div>

        <div id="gameViewerContainer">
          <div class="game-viewer-toolbar">
            <span id="gameViewerTitle" style="font-size: 1.25rem; font-weight: bold;">Loading Game...</span>
            <div>
               <button onclick="document.getElementById('gameFrame').requestFullscreen()">Fullscreen</button>
               <button onclick="closeDashboardGame()">Close Game</button>
            </div>
          </div>
          <div id="gameViewer"></div>
        </div>
      </main>

      <aside class="ic-app-main-content__secondary">
        <div class="todo-header">To Do</div>
        
        <div class="todo-item">
          <svg viewBox="0 0 1920 1920"><path d="M1468 0v564h-112V112H112v1694h1242v-225h112v338H0V0h1468Zm129 581c22-22 57-22 79 0l225 225c22 22 22 57 0 79l-677 677c-10 10-24 16-39 16h-225c-31 0-56-25-56-56v-225c0-15 5-29 16-39Zm-155 314-425 425v146h146l425-425-146-146Zm-764 346v112H338v-112h338Zm225-225v112H338v-112h564Zm734-315-115 115 146 146 115-115-146-146ZM1129 338v451H338V338h790Zm-112 112H451v225h564V451Z"/></svg>
          <div class="todo-item-details">
            <div class="todo-item-title">Study for Test</div>
            <div class="todo-item-course">AP Gaming</div>
            <div class="todo-item-due">10 points • Due Tomorrow</div>
          </div>
        </div>

        <div class="todo-item">
          <svg viewBox="0 0 1920 1920"><path d="M1468 0v564h-112V112H112v1694h1242v-225h112v338H0V0h1468Zm129 581c22-22 57-22 79 0l225 225c22 22 22 57 0 79l-677 677c-10 10-24 16-39 16h-225c-31 0-56-25-56-56v-225c0-15 5-29 16-39Zm-155 314-425 425v146h146l425-425-146-146Zm-764 346v112H338v-112h338Zm225-225v112H338v-112h564Zm734-315-115 115 146 146 115-115-146-146ZM1129 338v451H338V338h790Zm-112 112H451v225h564V451Z"/></svg>
          <div class="todo-item-details">
            <div class="todo-item-title">Read the textbook</div>
            <div class="todo-item-course">English</div>
            <div class="todo-item-due">100 points • Due Next Week</div>
          </div>
        </div>
      </aside>

    </div>
  </div>

  <script src="games.js"></script>

  <script>
    // Store original functions from games.js
    const coreOpenGame = window.openGame;
    
    // Override how the games are generated to inject Canvas Card styles
    window.displayGames = function(games) {
      const container = document.getElementById('games');
      container.innerHTML = "";
      
      if (!games || games.length === 0) {
        container.innerHTML = "<p>No games found.</p>";
        return;
      }

      games.forEach((game) => {
        // Parse the image URL the same way games.js does
        let imgSrc = game.cover ? game.cover.replace("{COVER_URL}", "https://cdn.jsdelivr.net/gh/Toaster68/covers2@main").replace("{HTML_URL}", "https://cdn.jsdelivr.net/gh/Toaster68/html2@main") : '';
        let gameAuthor = game.author || game.dev || 'Sodalite Games';

        // Create standard Canvas Card Element
        const card = document.createElement("div");
        card.className = "ic-DashboardCard";
        card.innerHTML = `
          <div class="ic-DashboardCard__header" style="height: 146px; background-image: url('${imgSrc}'); background-size: cover; background-position: center;">
          </div>
          <div style="padding: 15px;">
            <div style="font-weight: bold; font-size: 0.875rem; color: #0A5A9E; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${game.name}</div>
            <div style="font-size: 0.75rem; color: #4a5b68;">${gameAuthor}</div>
          </div>
        `;
        
        // Custom Click Event
        card.onclick = () => {
          // Hide Dashboard Grid
          document.getElementById('games').style.display = 'none';
          document.getElementById('dashboardTitle').style.display = 'none';
          
          // Show the new inline player wrapper
          const viewerContainer = document.getElementById('gameViewerContainer');
          viewerContainer.style.display = 'flex';
          document.getElementById('gameViewerTitle').innerText = game.name;
          
          // Let games.js do its standard iframe loading magic into #gameViewer
          if (typeof coreOpenGame === 'function') {
            coreOpenGame(game);
          }
        };

        container.appendChild(card);
      });
    };

    // UI Handle to close the game and return to the grid safely
    window.closeDashboardGame = function() {
      // Hide Player
      document.getElementById('gameViewerContainer').style.display = 'none';
      
      // Call games.js core close function if it exists to cleanup URLs/iframes
      if (typeof window.closeGame === 'function') {
        window.closeGame(); 
      }
      
      // Restore Grid
      document.getElementById('games').style.display = 'grid';
      document.getElementById('dashboardTitle').style.display = 'block';
    };
  </script>

</body>
</html>
