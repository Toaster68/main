  <style>
    /* =========================================================
       CANVAS VARIABLE FALLBACKS
       (in case CDN variables sheet doesn't load)
       ========================================================= */
    :root {
      --ic-brand-primary: #0A5A9E;
      --ic-brand-font-color-dark: #273540;
      --ic-link-color: #09508C;
      --ic-brand-button--primary-bgd: #0A5A9E;
      --ic-brand-button--primary-text: #ffffff;
      --ic-brand-global-nav-bgd: #334451;
      --ic-brand-global-nav-ic-icon-svg-fill: #ffffff;
      --ic-brand-global-nav-ic-icon-svg-fill--active: var(--ic-brand-primary);
      --ic-brand-global-nav-menu-item__text-color: #ffffff;
      --ic-brand-global-nav-menu-item__text-color--active: #09508C;
    }

    /* =========================================================
       CANVAS GLOBAL NAV (left sidebar)
       Extracted from MHTML CID CSS parts
       ========================================================= */
    .ic-app-header {
      box-sizing: border-box;
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      width: 54px;
      z-index: 100;
      background-color: var(--ic-brand-global-nav-bgd);
    }
    .ic-app-header__main-navigation {
      box-sizing: border-box;
      flex: 1 0 auto;
    }
    .ic-app-header__main-navigation a {
      text-decoration: none;
    }
    .ic-app-header__secondary-navigation {
      box-sizing: border-box;
      position: absolute;
      left: 0;
      bottom: 0;
      z-index: 1;
      width: 100%;
    }
    .ic-app-header__menu-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .ic-app-header__menu-list li {
      margin: 0;
      padding: 0;
    }
    .ic-app-header__menu-list-item {
      box-sizing: border-box;
    }
    .ic-app-header__menu-list-item svg {
      width: 1.625rem;
      height: 1.625rem;
    }
    .ic-app-header__menu-list-item.ic-app-header__menu-list-item--active .ic-app-header__menu-list-link {
      background: #ffffff;
    }
    .ic-app-header__menu-list-item.ic-app-header__menu-list-item--active .ic-icon-svg {
      fill: var(--ic-brand-primary);
    }
    .ic-app-header__menu-list-item.ic-app-header__menu-list-item--active .menu-item-icon-container {
      color: var(--ic-brand-primary);
    }
    .ic-app-header__menu-list-item.ic-app-header__menu-list-item--active .menu-item__text {
      color: var(--ic-brand-primary);
    }
    .ic-app-header__menu-list-link {
      box-sizing: border-box;
      transition: background-color 0.3s, padding 0.3s;
      position: relative;
      text-align: center;
      display: block;
      color: var(--ic-brand-global-nav-menu-item__text-color);
      border-style: none;
      padding: 0.4375rem 0;
      text-decoration: none;
    }
    .ic-app-header__menu-list-link:hover,
    .ic-app-header__menu-list-link:focus {
      background-color: rgba(0, 0, 0, 0.2);
    }
    .menu-item-icon-container {
      position: relative;
      width: 26px;
      height: 26px;
      margin: 0 auto;
      color: var(--ic-brand-global-nav-ic-icon-svg-fill);
    }
    .menu-item-icon-container svg {
      fill: currentColor;
      display: block;
    }
    .ic-icon-svg {
      fill: var(--ic-brand-global-nav-ic-icon-svg-fill);
    }
    .ic-app-header__menu-list-item.ic-app-header__menu-list-item--active .ic-icon-svg {
      fill: var(--ic-brand-global-nav-ic-icon-svg-fill--active);
    }
    .menu-item__badge {
      display: none; /* badges not needed for our nav */
    }
    .menu-item__text {
      display: block;
      font-size: 0.5625rem;
      font-weight: bold;
      letter-spacing: 0.03em;
      line-height: 1;
      padding: 0.1875rem 0.25rem 0;
      color: inherit;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Avatar for profile item */
    .ic-avatar {
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      width: 36px;
      height: 36px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #555;
      font-size: 1rem;
      color: #fff;
      font-weight: bold;
      margin: 0 auto;
    }

    /* =========================================================
       CANVAS LAYOUT (extracted from common CSS)
       ========================================================= */
    html, body {
      height: 100%;
      font-family: "Lato Extended", Lato, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 1rem;
      color: #273540;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    body {
      margin-left: 54px; /* space for fixed global nav */
    }
    .ic-Layout-wrapper {
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .ic-Layout-columns {
      position: relative;
      box-sizing: border-box;
      z-index: 10;
      flex: 1 0 auto;
      min-width: 1px;
    }
    .ic-Layout-watermark {
      position: absolute;
      left: 0;
      bottom: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      opacity: 0;
    }
    .ic-app-main-content {
      box-sizing: border-box;
      flex: 1 1 0%;
      min-width: 1px;
      display: flex; /* side-by-side: content + sidebar */
    }
    .ic-Layout-contentWrapper {
      box-sizing: border-box;
      flex: 1 1 0%;
      min-width: 1px;
    }
    .ic-Layout-contentMain {
      padding: 36px 48px 48px;
      box-sizing: border-box;
    }
    .ic-app-main-content__secondary {
      box-sizing: border-box;
      min-width: 1px;
      padding: 24px 24px 24px 24px;
      position: relative;
      width: 288px;
      flex-shrink: 0;
    }

    /* =========================================================
       CANVAS DASHBOARD HEADER
       (from dashboard.css, extracted from MHTML)
       ========================================================= */
    .ic-dashboard-app {
      margin-top: -24px;
    }
    .ic-Dashboard-header {
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .ic-Dashboard-header__layout {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid #e8eaec;
      background: rgba(255, 255, 255, 0.95);
      box-sizing: border-box;
      height: auto;
      min-height: 4.5rem;
      padding: 0 0.75rem;
    }
    .ic-Dashboard-header__title {
      margin: 0;
      flex: 1 1 0%;
      padding-right: 12px;
      box-sizing: border-box;
      font-size: 1.5rem;
      font-weight: 700;
      color: #273540;
    }
    .ic-Dashboard-header__actions {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    /* =========================================================
       CANVAS DASHBOARD CARDS
       (all from dashboard_card.css – included via CDN above,
       these are just inline fallbacks for key rules)
       ========================================================= */
    .ic-DashboardCard__box {
      padding: 24px 0.125rem 0;
    }
    .ic-DashboardCard__box__container {
      margin: -36px 0 0 -36px;
    }
    .ic-DashboardCard {
      box-sizing: border-box;
      box-shadow: rgba(0,0,0,0.3) 0 2px 5px;
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
      width: 262px;
      display: inline-block;
      vertical-align: top;
      margin: 36px 0 0 36px;
      cursor: pointer;
    }
    .ic-DashboardCard:hover {
      box-shadow: rgba(0,0,0,0.35) 0 4px 10px;
    }
    .ic-DashboardCard__header {
      position: relative;
      cursor: pointer;
      box-sizing: border-box;
    }
    .ic-DashboardCard__header_image {
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      height: 146px;
    }
    .ic-DashboardCard__header_hero {
      box-sizing: border-box;
      height: 146px;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .ic-DashboardCard__header_content {
      box-sizing: border-box;
      padding: 12px 18px 0;
      background: #fff;
      border: 0.125rem solid transparent;
      border-radius: 6px;
      transition: border-color 0.2s;
    }
    .ic-DashboardCard__header-title {
      transition: 0.2s ease-out;
      padding: 0;
      margin: 0;
      line-height: 1.3;
      font-size: 0.875rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ic-DashboardCard__header-subtitle {
      line-height: 1.3;
      padding: 0;
      margin-top: 4px;
      font-size: 0.75rem;
      color: #4a5b68;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ic-DashboardCard__header-term {
      line-height: 1.3;
      font-size: 12px;
      height: 1rem;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ic-DashboardCard__action-container {
      box-sizing: border-box;
      display: flex;
      align-items: flex-end;
      padding: 0 0 12px;
      margin-top: 9px;
      height: 2.5rem;
    }
    .ic-DashboardCard__action {
      transition: color 0.2s;
      box-sizing: border-box;
      color: #3e5466;
      flex: 0 0 25%;
      display: flex;
      justify-content: center;
    }
    .ic-DashboardCard__action:hover {
      color: var(--ic-brand-primary);
    }
    .ic-DashboardCard__action-layout {
      position: relative;
      font-size: 24px;
    }
    .ic-DashboardCard__header-button {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.25rem;
    }
    .ic-DashboardCard__header-button-bg {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    /* =========================================================
       CANVAS TODO SIDEBAR
       (from react_todo_sidebar.css + common)
       ========================================================= */
    .todo-list-header {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 16px 0;
      padding-bottom: 12px;
      border-bottom: 1px solid #e8eaec;
      color: #273540;
    }
    #planner-todosidebar-item-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .canvas-todo-item {
      padding: 0;
      margin: 0 0 12px 0;
    }
    .ToDoSidebarItem {
      line-height: 1.1;
      display: flex;
      align-items: flex-start;
      margin: 0 0 6px;
    }
    .ToDoSidebarItem__Icon {
      display: block;
      font-size: 1rem;
      margin-top: 4px;
      color: #3e5466;
      flex-shrink: 0;
    }
    .ToDoSidebarItem__Info {
      min-width: 0;
      flex: 1 1 0%;
      padding: 0 6px 0 9px;
      margin-top: 4px;
    }
    .ToDoSidebarItem__Title {
      margin-bottom: 3px;
      font-size: 0.875rem;
      font-weight: bold;
      color: #273540;
    }
    .ToDoSidebarItem__CourseLabel {
      font-size: 0.75rem;
      color: #4a5b68;
      margin-top: 2px;
    }
    .ToDoSidebarItem__DueDate {
      font-size: 0.75rem;
      color: #666;
      margin-top: 2px;
    }
    .ToDoSidebarItem__Close {
      margin-top: 4px;
      flex-shrink: 0;
    }
    .canvas-todo-dismiss {
      background: transparent;
      border: none;
      cursor: pointer;
      color: #4a5b68;
      padding: 2px;
      font-size: 0.75rem;
      border-radius: 3px;
    }
    .canvas-todo-dismiss:hover {
      background: rgba(0,0,0,0.07);
      color: #273540;
    }

    /* Data controls in sidebar */
    .canvas-data-controls {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e8eaec;
    }
    .canvas-data-controls h3 {
      font-size: 0.875rem;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: #273540;
    }
    .canvas-data-btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: #f5f5f5;
      border: 1px solid #c7cdd1;
      border-radius: 4px;
      font-size: 0.8125rem;
      color: #273540;
      cursor: pointer;
      text-align: left;
      box-sizing: border-box;
    }
    .canvas-data-btn:hover {
      background: #e8eaec;
    }

    /* Search in dashboard header */
    #gamesearch {
      box-sizing: border-box;
      padding: 6px 12px;
      border: 1px solid #c7cdd1;
      border-radius: 4px;
      font-size: 0.875rem;
      width: 220px;
      color: #273540;
    }
    #gamesearch:focus {
      outline: 2px solid var(--ic-brand-primary);
      outline-offset: 0;
      border-color: var(--ic-brand-primary);
    }

    /* Sort dropdown */
    #sortOptions {
      padding: 6px 12px;
      border: 1px solid #c7cdd1;
      border-radius: 4px;
      font-size: 0.875rem;
      color: #273540;
      background: #fff;
    }

    /* Loading state */
    #games.loading-state {
      color: #666;
      padding: 24px;
      font-style: italic;
    }

    /* =========================================================
       GAME VIEWER (unchanged from original — override nothing here,
       just ensure it covers the Canvas layout when open)
       ========================================================= */
    #gameViewer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      background: #000;
      display: none;
      flex-direction: column;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */
    @media (max-width: 768px) {
      body { margin-left: 0; }
      .ic-app-header { display: none; }
      .ic-Layout-contentMain { padding: 12px; }
      .ic-app-main-content__secondary { display: none; }
      .ic-DashboardCard { width: 100%; margin-left: 0; }
      .ic-DashboardCard__box__container { margin-left: 0; }
    }

    /* Screenreader only */
    .screenreader-only {
      border: 0;
      clip: rect(0,0,0,0);
      height: 1px;
      margin: -1px;
      overflow: hidden;
      padding: 0;
      position: absolute;
      width: 1px;
    }

    /* Ellipsis helper */
    .ellipsis {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>

  <!-- ========================================================
       DISPLAY OVERRIDE
       Override displayGames() from games.js to render
       Canvas ic-DashboardCard elements instead of .game divs.
       This runs after games.js is parsed; the override is in
       place before the async fetch callbacks fire.
       ======================================================== -->
  <script>
    // Card accent colors (Canvas palette)
    const _canvasCardColors = [
      '#0A5A9E', '#008005', '#E1185C', '#D9005F',
      '#B53E05', '#986C16', '#1C93A8', '#6B00C8',
      '#0076B8', '#3172D8', '#00897B', '#7B3F00'
    ];

    function _getCardColor(id) {
      const idx = Math.abs(parseInt(id) || 0) % _canvasCardColors.length;
      return _canvasCardColors[idx];
    }

    // Play icon SVG (used in action bar)
    const _playSVG = `<svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" fill="currentColor">
      <path d="M8 5v14l11-7z"/>
    </svg>`;

    /**
     * Override the displayGames function from games.js.
     * Renders games as Canvas ic-DashboardCard elements.
     */
    window.displayGames = function(games) {
      const container = document.getElementById('games');
      if (!container) return;
      container.innerHTML = '';

      if (!games || games.length === 0) {
        container.innerHTML = '<p style="padding:24px;color:#666;">No games found.</p>';
        return;
      }

      games.forEach(function(game) {
        const color = _getCardColor(game.id);

        // Resolve cover URL (same logic as original displayGames)
        const coverURL = 'https://cdn.jsdelivr.net/gh/Toaster68/covers2@main';
        const htmlURL  = 'https://cdn.jsdelivr.net/gh/Toaster68/html2@main';
        let coverSrc = '';
        if (game.cover) {
          coverSrc = game.cover
            .replace('{COVER_URL}', coverURL)
            .replace('{HTML_URL}', htmlURL);
        }

        const author = game.author || game.dev || game.developer || '';
        const subtitle = author || ('Game #' + game.id);

        const card = document.createElement('div');
        card.className = 'ic-DashboardCard';
        card.setAttribute('aria-label', game.name);
        card.setAttribute('data-testid', 'canvas-game-card');
        card.style.opacity = '1';

        card.innerHTML = `
          <div class="ic-DashboardCard__header">
            <span class="screenreader-only">Cover image for ${game.name}</span>
            <div class="ic-DashboardCard__header_image"
                 style="background-image: url('${coverSrc}'); height: 146px;">
              <div class="ic-DashboardCard__header_hero"
                   aria-hidden="true"
                   style="background-color: ${color}; opacity: ${coverSrc ? '0' : '1'}; height: 146px;">
              </div>
            </div>
            <div class="ic-DashboardCard__header_content">
              <h3 class="ic-DashboardCard__header-title ellipsis"
                  title="${game.name}">
                <span style="color: ${color};">${game.name}</span>
              </h3>
              <div class="ic-DashboardCard__header-subtitle ellipsis"
                   title="${subtitle}">${subtitle}</div>
              <div class="ic-DashboardCard__header-term ellipsis"
                   title="Sodalite Games">Sodalite Games</div>
            </div>
            <div>
              <div class="ic-DashboardCard__header-button-bg"
                   style="background-color: ${color}; opacity: 1;"></div>
            </div>
          </div>
          <nav class="ic-DashboardCard__action-container"
               aria-label="Actions for ${game.name}">
            <span class="ic-DashboardCard__action" title="Play ${game.name}" style="flex: 0 0 100%; font-size: 22px; color: ${color};">
              ${_playSVG}
            </span>
          </nav>
        `;

        // Entire card click opens the game
        card.addEventListener('click', function() {
          openGame(game);
        });

        container.appendChild(card);
      });

      // Update count in summary label if it exists
      const allSummary = document.getElementById('allSummary');
      if (allSummary) allSummary.textContent = 'All Games (' + games.length + ')';
    };

    // Fix cover: if image fails to load, show color background
    document.addEventListener('DOMContentLoaded', function() {
      // Observe card additions and handle broken images
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            if (node.nodeType === 1 && node.classList && node.classList.contains('ic-DashboardCard')) {
              const imgDiv = node.querySelector('.ic-DashboardCard__header_image');
              const heroDiv = node.querySelector('.ic-DashboardCard__header_hero');
              if (imgDiv && heroDiv) {
                const bgImg = imgDiv.style.backgroundImage;
                if (bgImg && bgImg !== 'none' && bgImg !== '') {
                  // Test image load via a temporary Image element
                  const url = bgImg.slice(5, -2); // strip url(' and ')
                  const img = new Image();
                  img.onload = function() { heroDiv.style.opacity = '0'; };
                  img.onerror = function() {
                    imgDiv.style.backgroundImage = 'none';
                    heroDiv.style.opacity = '1';
                  };
                  img.src = url;
                }
              }
            }
          });
        });
      });
      const gamesContainer = document.getElementById('games');
      if (gamesContainer) {
        observer.observe(gamesContainer, { childList: true });
      }
    });
  </script>
